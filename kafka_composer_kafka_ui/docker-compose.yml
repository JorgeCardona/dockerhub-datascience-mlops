      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"

      KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="12345678" user_admin="12345678";'

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

    volumes:
      - "/var/lib/docker/volumes/kafka_4_4_0_kafka2_data/_data:/var/lib/kafka/data"
      - "/var/lib/docker/volumes/19378210e7ea2d63bde9f9dec7cf0ab09ee1efcb764732117b25c76003db219e/_data:/mnt/shared/config"
      - "/var/lib/docker/volumes/fde2934ce46076168e0c1803c0e138460a759ebd90c52352b8d3b9e008b82d27/_data:/etc/kafka/secrets"


  # ==========================================
  # KAFKA BROKER 3
  # ==========================================
  kafka-3:
    image: apache/kafka:4.4.0
    container_name: kafka-3
    restart: unless-stopped

    ports:
      - "9094:9094"

    environment:
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
