      - "/var/lib/docker/volumes/c193beb6290626e763788e834ab0428c6a62f65be9b3835f079a690c3a59fa78/_data:/etc/kafka/secrets"
      - "/var/lib/docker/volumes/f36d92e1e49b5b24260772ac98a5ab2ac56a0e1d22f000ac0f4f0b6674a1145b/_data:/mnt/shared/config"


  # ==========================================
  # KAFKA UI
  # ==========================================
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "cluster-kafka-local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"