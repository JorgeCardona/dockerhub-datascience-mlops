# ==============================================================================
# REQUISITOS DE PAQUETES PYTHON (PIP)
# ==============================================================================
# Si usas la imagen Docker "jorgecardona/datascience-mlops", todos estos paquetes
# ya vienen preinstalados. Si lo usas en otro entorno, instala obligatoriamente:
#
# pip install pre-commit ruff yamllint sqlfluff sqlfluff-templater-dbt pytest pytest-cov
# ==============================================================================
# INSTRUCCIONES DE INSTALACIÓN Y UBICACIÓN
# ==============================================================================
# 1. Tanto este archivo (.pre-commit-config.yaml) como (.sqlfluff) deben ubicarse
#    directamente en la carpeta raíz (root) de tu proyecto, al mismo nivel que .git/
#
#    Estructura esperada del proyecto:
#    tu-proyecto/                  <-- Raíz (root) del repositorio Git
#    ├── .git/                     <-- Carpeta oculta de Git
#    ├── .pre-commit-config.yaml   <-- ESTE ARCHIVO (debe ir en el root)
#    ├── .sqlfluff                 <-- Reglas de estilo SQL (debe ir en el root)
#    ├── src/
#    └── tests/
#
# 2. Una vez ubicados en la raíz, abre la terminal en esa carpeta y ejecuta una sola vez:
#    pre-commit install
#
# 3. A partir de ese momento, cada vez que ejecutes "git commit -m '...'", todas
#    las validaciones, formateos y pruebas correrán de forma automática.
# ==============================================================================

default_install_hook_types: [pre-commit, commit-msg]  # Activa revisiones de archivos y mensajes al instalar

repos:
  # ==============================================================================
  # 1. HOOKS ESTÁNDAR DE GIT (Seguridad, estructura y validación de archivos)
  # ==============================================================================
  - repo: https://github.com
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace       # Elimina espacios invisibles al final de cada línea
      - id: end-of-file-fixer         # Asegura una línea en blanco al final de cada archivo
      - id: check-added-large-files   # Bloquea datasets o modelos pesados (> 1 MB)
        args: ['--maxkb=1000']
      - id: check-merge-conflict      # Evita commits con marcas de conflicto sin resolver
      - id: detect-private-key        # Detecta llaves privadas SSH o certificados
      - id: debug-statements          # Evita dejar llamadas a breakpoint() o pdb olvidadas
      - id: check-json                # Valida que los archivos .json no tengan errores de sintaxis
      - id: check-toml                # Valida que los archivos .toml no tengan errores de sintaxis
      - id: pretty-format-json        # Formatea archivos .json automáticamente manteniendo orden de claves
        args: ['--autofix', '--no-sort-keys']

  # ==============================================================================
  # 2. SEGURIDAD AVANZADA: DETECCIÓN DE SECRETOS Y API KEYS (OpenAI, AWS, DBs)
  # ==============================================================================
  - repo: https://github.com
    rev: v8.21.2
    hooks:
      - id: gitleaks                  # Escanea tokens de OpenAI, Gemini, AWS, contraseñas, etc.

  # ==============================================================================
  # 3. LIMPIEZA DE JUPYTER NOTEBOOKS (.ipynb)
  # ==============================================================================
  - repo: https://github.com
    rev: 0.8.1
    hooks:
      - id: nbstripout                # Borra salidas pesadas (gráficos, tablas) de los notebooks

  # ==============================================================================
  # 4. CALIDAD DE INFRAESTRUCTURA Y DOCUMENTACIÓN (Dockerfile y Ortografía)
  # ==============================================================================
  - repo: https://github.com
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker           # Revisa buenas prácticas y seguridad en archivos Dockerfile

  - repo: https://github.com
    rev: v2.3.0
    hooks:
      - id: codespell                 # Corrige errores ortográficos comunes en código y Markdown
        args: ['--write-changes']

  # ==============================================================================
  # 5. ESTÁNDAR DE MENSAJES DE COMMIT (Conventional Commits)
  # ==============================================================================
  - repo: https://github.com
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit   # Obliga mensajes con prefijo: feat:, fix:, docs:, chore:, etc.
        stages: [commit-msg]

  # ==============================================================================
  # 6. HERRAMIENTAS INSTALADAS EN TU DOCKERFILE (Ejecución local ultrarrápida)
  # ==============================================================================
  - repo: local
    hooks:
      - id: ruff-check                # Revisa errores, ordena imports y corrige automáticamente
        name: ruff-check
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ruff-format               # Formatea el código Python al estilo Black
        name: ruff-format
        entry: ruff format
        language: system
        types: [python]

      - id: yamllint                  # Valida indentación y sintaxis en archivos .yml/.yaml
        name: yamllint
        entry: yamllint -d relaxed
        language: system
        types: [yaml]

      - id: sqlfluff-fix              # Pone SQL en MAYÚSCULAS y exige "AS" en todos los alias
        name: sqlfluff-fix
        entry: sqlfluff fix
        language: system
        types: [sql]

      - id: pytest-cov                # Ejecuta tests y exige cobertura >= 85% para permitir el commit
        name: pytest-coverage-85
        entry: pytest --cov=. --cov-fail-under=85
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
