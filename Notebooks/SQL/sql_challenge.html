<body class="bg-[#0b0f19] text-slate-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

    <div class="max-w-6xl mx-auto">
        
        <!-- HEADER -->
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 pb-6 border-b border-slate-800/80">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight flex items-center gap-2.5">
                    <i data-lucide="database" class="w-6 h-6 text-blue-500"></i>
                    SQL Mastery Workbook
                    <span class="text-xs px-2.5 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 font-medium">
                        50 Exercises
                    </span>
                </h1>
                <p class="text-xs text-slate-400 mt-1">Advanced practical business problem-solving platform for SQL (Schema: <code class="text-blue-300">users, orders, order_items, products, event_logs</code>)</p>
            </div>

            <!-- Global Progress & Score Trackers -->
            <div class="flex flex-wrap items-center gap-4">
                <!-- Global Progress -->
                <div class="bg-[#0f172a] border border-[#1e293b] px-4 py-2 rounded-xl flex items-center gap-3 shadow-sm">
                    <div class="flex flex-col">
                        <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Global Progress</span>

                    </div>
                    <div class="w-24 bg-slate-800 h-2 rounded-full overflow-hidden">

                    </div>
                </div>

                <!-- Global Score -->
                <div class="bg-[#0f172a] border border-[#1e293b] px-4 py-2 rounded-xl flex items-center gap-3 shadow-sm">

                        <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Global Score</span>

                    </div>
                    <div class="w-24 bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div id="score-bar" class="bg-amber-500 h-full transition-all duration-300 w-0"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- NAVBAR & SEARCH -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 mb-6">
            
            <!-- Category Tabs -->
            <div class="flex items-center gap-1.5 bg-[#0f172a] p-1.5 rounded-xl border border-[#1e293b] overflow-x-auto custom-scrollbar">

                </button>
                <button onclick="setFilter('Junior')" id="btn-Junior" class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 shrink-0">
                    Junior (5)
                </button>
                <button onclick="setFilter('Mid-Level')" id="btn-Mid-Level" class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 shrink-0">
                    Mid-Level (10)
                </button>
                <button onclick="setFilter('Senior')" id="btn-Senior" class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 shrink-0">
                    Senior (15)
                </button>
                <button onclick="setFilter('Lead')" id="btn-Lead" class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 shrink-0">

            </div>
        </div>

        <!-- EXERCISES CARDS CONTAINER -->
        <div id="exercise-list" class="space-y-3.5">

        <!-- EMPTY STATE -->
        <div id="empty-state" class="hidden text-center py-16 bg-[#0f172a]/50 rounded-2xl border border-[#1e293b]">

            <h3 class="text-sm font-semibold text-slate-300">No exercises found</h3>
            <p class="text-xs text-slate-500 mt-1">Try selecting another category or changing your search term.</p>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const exercises = [
            // ==========================================
            // JUNIOR (5 Exercises) - 1 pt each
            // ==========================================
            { 
                id: 1, 
                level: 'Junior', 
                points: 1,
                title: 'Customer Segmentation by Local Market', 
                question: "The Marketing team in Spain will launch a localized email campaign. Extract the full name, email address, and exact registration date of all registered users whose country code is 'ES'. Sort the results alphabetically by full name.", 
                hint: "Segmentación de Clientes por Mercado Local: El equipo de Marketing en España iniciará una campaña localizada por correo electrónico. Extrae el nombre completo, correo electrónico y la fecha exacta de registro de todos los usuarios registrados cuyo código de país sea 'ES'. Ordena los resultados alfabéticamente por nombre completo. Pista técnica: Filtra la tabla 'users' utilizando 'WHERE country = 'ES'' y ordena el resultado final con la cláusula 'ORDER BY full_name ASC'." 
            },
            { 
                id: 2, 
                level: 'Junior', 
                points: 1,
                title: 'Premium Electronics Showcase', 
                question: "The commercial department wants to feature high-end products on the website. Retrieve the product name and unit price for all items belonging to the 'electronics' category with an inventory price strictly greater than $50.00 USD.", 
                hint: "Catálogo Premium de Electrónica: El departamento comercial busca destacar productos de gama alta en el sitio web. Obtén el nombre del producto y su precio unitario para todos los artículos pertenecientes a la categoría 'electronics' cuyo valor en inventario sea estrictamente mayor a $50.00 USD. Pista técnica: Aplica condiciones combinadas sobre la tabla 'products' usando 'WHERE category = 'electronics' AND price > 50.00'." 
            },
            { 
                id: 3, 
                level: 'Junior', 
                points: 1,
                title: 'Audit of Recent Successful Orders', 
                question: "The operations team needs to validate the recent dispatch workflow. Generate a list of the 10 purchase orders with 'completed' status created within the last 30 days. Display the order ID, purchase date, and payment method, sorted starting from the most recent.", 
                hint: "Auditoría de Pedidos Exitosos Recientes: El equipo de operaciones necesita validar el flujo de despacho reciente. Genera un listado de las 10 órdenes de compra con estado 'completed' que hayan sido creadas dentro de los últimos 30 días. Muestra el ID de orden, la fecha de compra y el método de pago, ordenadas comenzando por la más reciente. Pista técnica: Consulta la tabla 'orders' filtrando por 'status = 'completed'' y 'order_date >= date('now', '-30 days')'. Usa 'ORDER BY order_date DESC LIMIT 10'." 
            },
            { 
                id: 4, 
                level: 'Junior', 
                points: 1,
                title: 'Financial Breakdown per Line Item', 
                question: "Accounting requires verifying the exact net billed amount charged for each order line item. Extract order_id, product_id, quantity purchased, unit price, and a calculated column named 'net_amount' reflecting the charged amount after subtracting the direct registered discount.", 
                hint: "Desglose Financiero por Renglón de Venta: Contabilidad requiere verificar la facturación neta exacta cobrada en cada elemento de pedido. Extrae el order_id, product_id, la cantidad comprada, el precio unitario y una columna calculada llamada 'net_amount' que refleje el importe cobrado tras sustraer el descuento directo registrado. Pista técnica: Realiza el cálculo aritmético directo en el SELECT sobre 'order_items': '(quantity * unit_price) - discount AS net_amount'." 
            },
            { 
                id: 5, 
                level: 'Junior', 
                points: 1,
                title: 'Geographic Distribution of User Base', 
                question: "To plan regional server expansion, Infrastructure needs to know user density. Display the country code and total count of registered customers for each country, showing those with the highest concentration of users first.", 
                hint: "Distribución Geográfica de la Base de Usuarios: Para planificar la expansión de servidores regionales, Infraestructura necesita conocer la densidad de usuarios. Muestra el código de país y la cantidad total de clientes registrados por cada uno, desplegando primero aquellos países con la mayor concentración de usuarios. Pista técnica: Agrupa los registros de 'users' por país empleando 'GROUP BY country' junto a la función de agregación 'COUNT(*) AS total_users' ordenada descendentemente." 
            },

            // ==========================================
            // MID-LEVEL (10 Exercises) - 2 pts each
            // ==========================================
            { 
                id: 6, 
                level: 'Mid-Level', 
                points: 2,
                title: 'Customer Lifetime Purchase Value', 
                question: "Business Intelligence requires calculating the cumulative lifetime value (LTV) of each user. Display the user ID, full name, and total cumulative amount spent considering exclusively orders with 'completed' status.", 
                hint: "Valor Vitalicio de Compra por Cliente: El área de Business Intelligence requiere calcular el valor de vida útil (LTV) acumulado de cada usuario. Muestra el ID del usuario, su nombre completo y la suma total acumulada que ha desembolsado considerando exclusivamente sus órdenes con estado 'completed'. Pista técnica: Realiza un 'JOIN' entre 'users', 'orders' y 'order_items'. Agrupa por el ID de usuario y utiliza 'SUM((quantity * unit_price) - discount)' asegurando filtrar por 'orders.status = 'completed''." 
            },
            { 
                id: 7, 
                level: 'Mid-Level', 
                points: 2,
                title: 'Top 5 Buyers Showcase', 
                question: "Commercial management will reward the platform's best historical customers. Return the 5 users with the highest total historical spending. It is essential that the report includes users who have never made a purchase, showing $0.00 as their total.", 
                hint: "Escaparate del Top 5 de Compradores: Gerencia comercial premiará a los mejores clientes históricos de la plataforma. Devuelve los 5 usuarios con el mayor gasto histórico total. Es requisito indispensable que el reporte incluya a aquellos usuarios que jamás han realizado una compra, mostrando $0.00 en su acumulado. Pista técnica: Utiliza 'LEFT JOIN' comenzando desde la tabla 'users' hacia 'orders' y 'order_items' para conservar clientes sin ventas. Usa 'COALESCE(SUM(...), 0)' para evitar valores nulos y aplica 'LIMIT 5'." 
            },
            { 
                id: 8, 
                level: 'Mid-Level', 
                points: 2,
                title: 'Frequent Customer Loyalty', 
                question: "Customer Service will send a special coupon book to repeat buyers. Identify only users who have completed more than 3 confirmed orders in total on the platform. Display the user ID and the total count of completed orders.", 
                hint: "Fidelidad de Clientes Frecuentes: Atención al Cliente enviará una cuponera especial a compradores recurrentes. Identifica únicamente a los usuarios que hayan realizado más de 3 pedidos confirmados en total en la plataforma. Muestra el ID del usuario y la cantidad total de pedidos finalizados. Pista técnica: Agrupa las transacciones en la tabla 'orders' por 'user_id' e impón la condición sobre el conteo agrupado utilizando la cláusula 'HAVING COUNT(order_id) > 3'." 
            },
            { 
                id: 9, 
                level: 'Mid-Level', 
                points: 2,
                title: 'Payment Channel Performance', 
                question: "The Finance team wants to evaluate the profitability of integrated payment gateways. Calculate the Average Order Value (AOV) for each available payment method. Display the gateway and its average billed value in dollars.", 
                hint: "Rendimiento de Canales de Pago: El equipo de Finanzas desea evaluar la rentabilidad de las pasarelas de pago integradas. Calcula el ticket promedio por orden de compra (Average Order Value) para cada método de pago disponible. Muestra la pasarela y su valor promedio cobrado en dólares. Pista técnica: Combina 'orders' con 'order_items' para calcular el total de cada orden y agrupa por 'payment_method' aplicando la función 'AVG()' sobre los subtotales de las órdenes." 
            },
            { 
                id: 10, 
                level: 'Mid-Level', 
                points: 2,
                title: 'Consolidation of Granted Discounts', 
                question: "Auditing requires quantifying the total cost assumed by store promotions. Sum the absolute value of all discounts applied across order line items, explicitly ensuring that line items without assigned discounts do not break or invalidate the mathematical sum.", 
                hint: "Consolidación de Descuentos Otorgados: Auditoría requiere cuantificar el costo total asumido por promociones comerciales en la tienda. Suma el valor absoluto de todos los descuentos aplicados en los renglones de venta, garantizando expresamente que los registros sin descuento asignado no arruinen ni invaliden la sumatoria matemática. Pista técnica: Aplica la función 'COALESCE(discount, 0.0)' dentro de la agregación 'SUM()' en la tabla 'order_items' para convertir valores nulos en cero antes de procesar el cálculo." 
            },
            { 
                id: 11, 
                level: 'Mid-Level', 
                points: 2,
                title: 'Inventory Classification by Price Tier', 
                question: "Product Management requires categorizing catalog offerings for website filters. Display product name, current category, and a new 'price_tier' label configured as: 'Budget' if under $20 USD, 'Standard' if between $20 and $100 USD, and 'Premium' if exceeding $100 USD.", 
                hint: "Clasificación de Inventario por Escalón de Precio: Gestión de Producto requiere categorizar la oferta de catálogo para filtros web. Muestra el nombre del producto, su categoría actual y una nueva etiqueta 'price_tier' configurada así: 'Económico' si es menor a $20 USD, 'Estándar' si está entre $20 y $100 USD, y 'Premium' si supera los $100 USD. Pista técnica: Evalúa cada renglón en la tabla 'products' mediante una estructura lógica condicional 'CASE WHEN price < 20 THEN ... WHEN price BETWEEN 20 AND 100 THEN ... ELSE ... END'." 
            },
            { 
                id: 12, 
                level: 'Mid-Level', 
                points: 2,
                title: 'Average Unit Volume per Transaction', 
                question: "Logistics aims to optimize warehouse packaging by evaluating average shipped package size. Calculate the average number of total physical items contained within a standard purchase order.", 
                hint: "Volumen Medio de Unidades por Transacción: Logística busca optimizar el empaque en bodega evaluando el tamaño medio de los paquetes enviados. Calcula el número promedio de artículos físicos totales contenidos dentro de una orden de compra estándar. Pista técnica: Primero agrupa la tabla 'order_items' por 'order_id' para sumar la cantidad de artículos 'SUM(quantity)'. Luego envuelve esta consulta en una subconsulta para extraer el 'AVG()' global." 
            },
            { 
                id: 13, 
                level: 'Mid-Level', 
                points: 2,
                title: 'Navigation Prevalence by Device Type', 
                question: "The UX team needs to know which devices dominate user interaction. Process system logs and display each browsing platform along with its total event volume, ordered from highest to lowest frequency.", 
                hint: "Prevalencia de Navegación por Tipo de Dispositivo: El equipo de UX requiere conocer qué dispositivos dominan la interacción de los usuarios. Procesa las trazas del sistema y despliega cada plataforma de navegación junto al volumen total de eventos registrados, ordenado de mayor a menor frecuencia. Pista técnica: Extrae el valor guardado dentro del texto JSON con 'json_extract(metadata, '$.device')' sobre la tabla 'event_logs', agrupando y contando los registros resultantes." 
            },
            { 
                id: 14, 
                level: 'Mid-Level', 
                points: 2,
                title: 'Detection of Inactive Non-Converting Accounts', 
                question: "The Growth department aims to reactivate registered accounts that never completed a transaction. Generate a list with ID, full name, and email address of all registered users who have never placed an order on the platform.", 
                hint: "Detección de Cuentas Inactivas Sin Conversión: El área de Growth busca reactivar cuentas registradas que nunca concretaron una transacción. Genera un listado con el ID, nombre completo y correo electrónico de todos los usuarios registrados que jamás hayan iniciado un pedido en la plataforma. Pista técnica: Aplica un 'LEFT JOIN' desde 'users' hacia 'orders' y añade la condición en el filtro 'WHERE orders.order_id IS NULL'." 
            },
            { 
                id: 15, 
                level: 'Mid-Level', 
                points: 2,
                title: 'Average Promotional Margin by Category', 
                question: "The Pricing department wants to review which product lines experience higher discounts. Calculate the average monetary discount granted on sales grouped by product category.", 
                hint: "Margen Promedio de Promociones por Categoría: El departamento de Pricing quiere revisar qué líneas de producto sufren mayores rebajas. Calcula el descuento promedio monetario concedido en las ventas agrupando por la categoría del producto. Pista técnica: Une 'order_items' con 'products' usando 'product_id'. Agrupa por 'products.category' y calcula 'AVG(COALESCE(discount, 0))'." 
            },

            // ==========================================
            // SENIOR (15 Exercises) - 3 pts each
            // ==========================================
            { 
                id: 16, 
                level: 'Senior', 
                points: 3,
                title: 'Products Priced Above Sector Average', 
                question: "Sales aims to identify items priced above their direct niche average. Retrieve name, category, and price for all products whose catalog value is strictly higher than the average price of products in their same category.", 
                hint: "Productos de Precio Superior al Promedio Sectorial: Comercial busca identificar artículos que se posicionan por encima del precio medio de su nicho directo. Obtén el nombre, categoría y precio de todos los productos cuyo valor en catálogo sea estrictamente superior al precio promedio de los productos de su misma categoría. Pista técnica: Emplea una subconsulta correlacionada en el 'WHERE': 'WHERE price > (SELECT AVG(p2.price) FROM products p2 WHERE p2.category = products.category)'." 
            },
            { 
                id: 17, 
                level: 'Senior', 
                points: 3,
                title: 'VIP Buyers Above Global Average', 
                question: "Commercial Strategy will establish an exclusive rewards club. Find the full name and total cumulative spending of users whose overall spending exceeds the storewide average spent per customer.", 
                hint: "Compradores VIP por Encima de la Media Global: Estrategia Comercial creará un club de beneficios exclusivo. Encuentra el nombre completo y el consumo total acumulado de aquellos usuarios cuyo gasto global supere el promedio gastado por cliente en toda la tienda. Pista técnica: Usa una Expresión de Tabla Común ('WITH user_spending AS (...)') para consolidar el total por usuario y luego filtra en la consulta principal comparando 'WHERE total_spent > (SELECT AVG(total_spent) FROM user_spending)'." 
            },
            { 
                id: 18, 
                level: 'Senior', 
                points: 3,
                title: 'Demographic Sales Analysis by Age Bracket', 
                question: "Marketing wants to evaluate purchasing behavior by age segment. Extract age from the user profile and group total amount spent on completed orders into three brackets: 'Youth' (<30 years), 'Adults' (30 to 50 years), and 'Seniors' (>50 years).", 
                hint: "Análisis Demográfico de Ventas por Tramo de Edad: Marketing desea evaluar el comportamiento comercial por segmento de edad. Extrae la edad del perfil de usuario y agrupa el importe total gastado en órdenes completadas en tres bloques: 'Jóvenes' (<30 años), 'Adultos' (30 a 50 años) y 'Senior' (>50 años). Pista técnica: Aplica 'CAST(json_extract(profile_data, '$.age') AS INT)' para obtener la edad. Estructura un 'CASE WHEN' para definir los tramos y realiza la agregación 'SUM()' sobre las ventas." 
            },
            { 
                id: 19, 
                level: 'Senior', 
                points: 3,
                title: 'Mobile vs Desktop Traffic Share', 
                question: "The Product team requires metrics on mobile share of usage. Analyze browsing logs and calculate the exact percentage of events originating from mobile devices ('mobile') compared to desktop browsers ('desktop').", 
                hint: "Proporción de Tráfico por Entorno Móvil vs Escritorio: El equipo de Producto exige métricas sobre la cuota de uso móvil. Analiza el historial de navegación y calcula el porcentaje exacto de eventos originados en dispositivos móviles ('mobile') en comparación con navegadores de escritorio ('desktop'). Pista técnica: Extrae el dispositivo desde 'metadata' JSON en 'event_logs'. Utiliza agregación condicional: 'COUNT(CASE WHEN device = 'mobile' THEN 1 END) * 100.0 / COUNT(*)'." 
            },
            { 
                id: 20, 
                level: 'Senior', 
                points: 3,
                title: 'Efficient Pagination for High-Value Products', 
                question: "Engineering is building the backend for the web application and needs catalog pagination. Display the 5 products for the third page of results (assuming 5 items per page) when sorting the full catalog in descending order by price.", 
                hint: "Paginación Eficiente de Productos de Alto Valor: Sistemas está construyendo el backend de la aplicación web y requiere paginar el catálogo. Muestra los 5 productos de la tercera página de resultados (asumiendo páginas de 5 elementos cada una) cuando el catálogo completo se ordena de forma descendente según su precio. Pista técnica: Aplica las cláusulas de ordenamiento y desplazamiento 'ORDER BY price DESC LIMIT 5 OFFSET 10'." 
            },
            { 
                id: 21, 
                level: 'Senior', 
                points: 3,
                title: 'Identity Consolidation for Contact Audit', 
                question: "Compliance needs a unified list of unique emails for GDPR privacy auditing. Combine emails stored in the main user table with those recorded independently in system logs, ensuring zero duplicates.", 
                hint: "Consolidación de Identidades para Auditoría de Contacto: Compliance requiere construir una lista unificada de emails únicos para auditoría de privacidad GDPR. Combina los correos almacenados en la tabla principal de usuarios con aquellos correos registrados de forma independiente en las trazas del sistema, garantizando cero duplicados. Pista técnica: Consolida los registros utilizando el operador de conjuntos 'UNION' (sin la palabra clave 'ALL' para forzar la eliminación automática de duplicados)." 
            },
            { 
                id: 22, 
                level: 'Senior', 
                points: 3,
                title: 'Runner-Up Price in Electronics Tier', 
                question: "Product Development wants to analyze the margin gap between the flagship product and its secondary competitor. Identify the second most expensive product belonging to the 'electronics' category.", 
                hint: "Subcampeón de Precios en Gama Electrónica: Desarrollo de Producto desea evaluar la brecha de margen entre el artículo insignia y su competidor secundario. Identifica el segundo producto más costoso perteneciente a la categoría 'electronics'. Pista técnica: Filtra por la categoría solicitada, ordena de forma descendente por precio y selecciona el registro exacto usando 'ORDER BY price DESC LIMIT 1 OFFSET 1'." 
            },
            { 
                id: 23, 
                level: 'Senior', 
                points: 3,
                title: 'Order Churn and Cancellation Rate by Country', 
                question: "Quality Assurance seeks to measure regionalized logistical or payment failures. Calculate the exact percentage of cancelled orders ('status = 'cancelled'') out of total processed orders for each country.", 
                hint: "Tasa de Abandono y Cancelación de Pedidos por País: Control de Calidad busca medir fallas logísticas o de pago regionalizadas. Calcula el porcentaje exacto de órdenes canceladas ('status = 'cancelled'') sobre el total absoluto de pedidos procesados para cada país. Pista técnica: Realiza un 'JOIN' entre 'users' y 'orders'. Agrupa por 'country' y calcula 'COUNT(CASE WHEN status = 'cancelled' THEN 1 END) * 100.0 / COUNT(*)'." 
            },
            { 
                id: 24, 
                level: 'Senior', 
                points: 3,
                title: 'Exclusive Category Affinity',

                    </div>

                    <!-- SQL SCRATCHPAD DRAWER -->
                    <div class="${showCode ? 'block' : 'hidden'} mt-3.5 pt-3 border-t border-slate-800">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="text-[11px] font-mono text-slate-400 flex items-center gap-1.5">
                                <i data-lucide="terminal" class="w-3.5 h-3.5 text-blue-400"></i> Practice SQL Scratchpad:
                            </span>
                            <span class="text-[10px] text-slate-500">Saved in real-time</span>
                        </div>
                        <textarea oninput="saveNote(${ex.id}, this.value)" placeholder="Write your SQL query here to solve the business problem..."
                            class="w-full h-28 bg-[#0b0f19] border border-slate-800 rounded-xl p-3 text-xs font-mono text-blue-300 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-y custom-scrollbar">${savedQuery}</textarea>
                    </div>
                `;

                container.appendChild(card);
            });

            lucide.createIcons();
            updateProgressAndScore();
        }

        // Event Handlers
        function toggleHint(id) {
            visibleHints[id] = !visibleHints[id];
            
            // Mark hint as permanently opened for scoring penalty
            if (visibleHints[id] && !openedHints.includes(id)) {
                openedHints.push(id);
                localStorage.setItem('sql_wb_hints_opened_50_v3', JSON.stringify(openedHints));
            }

            renderExercises();
        }

        function toggleCode(id) {
            visibleCode[id] = !visibleCode[id];
            renderExercises();
        }

        function toggleCompletion(id) {
            if (completedExercises.includes(id)) {
                completedExercises = completedExercises.filter(i => i !== id);
            } else {
                completedExercises.push(id);
            }
            localStorage.setItem('sql_wb_completed_50_v3', JSON.stringify(completedExercises));
            renderExercises();
        }

        function saveNote(id, val) {
            userNotes[id] = val;
            localStorage.setItem('sql_wb_notes_50_v3', JSON.stringify(userNotes));
        }

        function updateProgressAndScore() {
            // 1. Progress Metrics
            const totalCount = exercises.length;
            const completedCount = completedExercises.length;
            const progressPercentage = Math.round((completedCount / totalCount) * 100);

            document.getElementById('progress-text').innerText = `${completedCount} / ${totalCount} (${progressPercentage}%)`;
            document.getElementById('progress-bar').style.width = `${progressPercentage}%`;

            // 2. Global Score Metrics
            let earnedScore = 0;
            exercises.forEach(ex => {
                if (completedExercises.includes(ex.id)) {
                    const isHintOpened = openedHints.includes(ex.id);
                    earnedScore += isHintOpened ? ex.points / 2 : ex.points;
                }
            });

            const scorePercentage = Math.round((earnedScore / totalPossibleScore) * 100);

            document.getElementById('score-text').innerText = `${earnedScore} / ${totalPossibleScore} pts (${scorePercentage}%)`;
            document.getElementById('score-bar').style.width = `${scorePercentage}%`;
        }

        function setFilter(level) {
            currentFilter = level;
            document.querySelectorAll('.nav-tab').forEach(btn => {
                btn.className = "nav-tab px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 shrink-0";
            });

            const activeBtn = document.getElementById(`btn-${level}`);
            if (activeBtn) {
                activeBtn.className = "nav-tab px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all bg-blue-600 text-white shadow-sm shrink-0";
            }

            renderExercises();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-bar').value;
            renderExercises();
        }

        // Initialize App on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            renderExercises();
        });
    </script>
</body>
</html>
